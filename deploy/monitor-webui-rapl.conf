# ===========================================================================
# monitor-webui —— 让非 root 用户读取 RAPL 功耗计数器（可选）
# ===========================================================================
# 背景：
#   /sys/class/powercap/**/energy_uj 默认权限是 0400 root，
#   普通用户（以及非 root 的 systemd 服务）读取会失败，
#   因此 CPU/整机功耗会显示“不可用”。
#
# 用法（二选一）：
#   A. 一次性放开（重启后失效）
#        sudo chmod a+r /sys/class/powercap/intel-rapl:0/energy_uj
#
#   B. 持久化（推荐）：把本文件复制为 /etc/tmpfiles.d/monitor-webui-rapl.conf
#        sudo cp deploy/monitor-webui-rapl.conf /etc/tmpfiles.d/
#        sudo systemd-tmpfiles --create /etc/tmpfiles.d/monitor-webui-rapl.conf
#      之后每次开机都会自动把权限设为 0444。
#
# 说明：
#   * 通配符 intel-rapl:* 一行覆盖所有子域：package-0（CPU）、
#     core、dram，以及 Intel 核显所在的 uncore 域（GPU 功耗需要它）。
#     AMD 平台换成 intel-rapl:* -> amd-rapl:* 即可（amd-rapl 只有 package）。
#   * 不想把计数器暴露给所有用户，可把 0444 改成 0440 + 属组
#     （例如 root monitor），并把服务用户加入该组。
#   * 不是每台机器都有 RAPL 与 psys 域；读不到时页面显示“不可用”属于预期行为。
# ===========================================================================

# 类型 权限 属主 属组 年龄 路径
z /sys/class/powercap/intel-rapl:*/energy_uj 0444 root root -